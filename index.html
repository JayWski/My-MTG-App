<style>

.th{width:48px;height:67px;border-radius:4px;flex:none;background:var(--line)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:12px 0}

.tabs button.on{color:var(--ink);border-bottom-color:var(--up)}
h3{font:600 17px Georgia,serif;margin:18px 0 0}.sm{padding:3px 8px;font-size:12px;margin-top:4px}
.pbtn{border:0;padding:0;font-weight:600;text-decoration:underline dotted;cursor:pointer}
#hm{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
#hm>div{background:var(--panel);color:var(--ink);border-radius:10px;max-width:420px;width:100%;max-height:80vh;display:flex;flex-direction:column;padding:16px}
#hm .sc{overflow:auto;margin:10px 0}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}th{position:sticky;top:0;background:var(--panel)}
#top{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:48px;height:48px;border-radius:50%;padding:0;display:none;align-items:center;justify-content:center;background:var(--acc);color:var(--bg);border:0;box-shadow:0 4px 14px #0006;font-size:24px;line-height:1;z-index:10;cursor:pointer}#top.show{display:flex}
.seg{display:inline-flex;margin:10px 0}.seg button{border-radius:0;padding:6px 14px}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0;border-left:0}.seg button[aria-pressed=true]{background:var(--acc);color:var(--bg)}

.gc{display:flex;flex-direction:column;gap:4px}.gi{width:100%;aspect-ratio:488/680;border-radius:5%/3.6%;background:var(--line);display:block}
.gp{font-size:16px}.gn{line-height:1.3;overflow-wrap:anywhere}.gq{margin-top:2px}
.dd{position:relative;display:inline-block;margin:10px 8px 10px 0}.ddm{position:absolute;left:0;top:100%;margin-top:4px;background:var(--panel);border:1px solid var(--ink);border-radius:6px;min-width:170px;z-index:12;padding:4px;box-shadow:0 6px 18px #0005}
.ddm button{display:block;width:100%;text-align:left;border:0;padding:8px 10px}.ddm button[aria-checked=true]{font-weight:700}
.dg{display:inline-flex;align-items:center;gap:6px;margin:8px 16px 8px 0}.dg .dd{margin:0}.dl{font-weight:600}
textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit;margin:4px 0}
</style></head><body><main id="app"></main><img id="pv" alt=""><button id="top" aria-label="Back to top" title="Back to top">↑</button>
<script>
const SB_URL='https://wihratryjsmcbpsistkj.supabase.co',SB_KEY='sb_publishable_6k9ibJeQe9iDIxYOCxgPPA_tJTjth8f';

const COLN={W:'White',U:'Blue',B:'Black',R:'Red',G:'Green'},COLO=['White','Blue','Black','Red','Green','Multicolor','Colorless'],RAR=['Common','Uncommon','Rare','Mythic','Special','Bonus'];
const GL=[['none','None'],['type','Type'],['subtype','Subtype'],['color','Color'],['mv','Mana Value'],['rarity','Rarity'],['set','Set'],['artist','Artist']];
const SL=[['mv','Mana Value'],['az','Alphabetical'],['rarity','Rarity'],['color','Color']];
const dd=(lab,items,cur,attr)=>{const nm=esc((items.find(i=>i[0]==cur)||['',''])[1]);return`<span class="dg"><span class="dl">${lab}:</span><div class="dd"><button aria-haspopup="true" aria-expanded="false" aria-label="${lab}: ${nm}">${nm} ▾</button><div class="ddm" role="menu" hidden>${items.map(([v,l])=>`<button role="menuitemradio" aria-checked="${cur==v}" ${attr}="${v}">${cur==v?'✓ ':''}${l}</button>`).join('')}</div></div></span>`};
const rarR=e=>{const i=['common','uncommon','rare','mythic','special','bonus'].indexOf(e.rarity);return i<0?99:i};
const colR=e=>{const c=(e.colors||'').split(',').filter(Boolean);return c.length>1?5:c.length?'WUBRG'.indexOf(c[0]):6};
const byName=(a,b)=>a.name.localeCompare(b.name);
const cmpFor=()=>srt=='mv'?(a,b)=>(a.cmc==null?1e9:Number(a.cmc))-(b.cmc==null?1e9:Number(b.cmc))||byName(a,b):srt=='rarity'?(a,b)=>rarR(a)-rarR(b)||byName(a,b):srt=='color'?(a,b)=>colR(a)-colR(b)||byName(a,b):byName;
const keyOf=e=>{switch(grp){
case'type':return plural(catOf(e));
case'subtype':{const p=(e.type_line||'').split(' // ')[0].split('—')[1];return p&&p.trim()?p.trim():'No subtype'}
case'color':{const c=(e.colors||'').split(',').filter(Boolean);return c.length>1?'Multicolor':c.length?COLN[c[0]]:'Colorless'}
case'mv':return e.cmc==null?'Unknown':'Mana value '+Number(e.cmc);
case'rarity':{const r=e.rarity||'unknown';return r[0].toUpperCase()+r.slice(1)}
case'set':return e.set_name||(e.set_code||'').toUpperCase()||'Unknown';
case'artist':return e.artist||'Unknown artist'}};
const sortOf=(e,k)=>grp=='type'?DISP.indexOf(catOf(e)):grp=='color'?COLO.indexOf(k):grp=='mv'?(e.cmc==null?1e9:Number(e.cmc)):grp=='rarity'?(RAR.indexOf(k)<0?99:RAR.indexOf(k)):(['No subtype','Unknown','Unknown artist'].includes(k)?'zzzz':'')+k;
const plural=k=>({Sorcery:'Sorceries',Conspiracy:'Conspiracies',Kindred:'Kindred',Other:'Other'}[k]||k+'s');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id),money=n=>n==null?'–':'$'+n.toFixed(2);
const pic=id=>`https://cards.scryfall.io/small/front/${id[0]}/${id[1]}/${id}.jpg`;
let srt='az';try{srt=localStorage.getItem('sort')||'az'}catch{}
let grp='type';try{grp=localStorage.getItem('group')||'type'}catch{}
let cur=null,tab='collection',view=matchMedia('(max-width:699px)').matches?'grid':'list';try{view=localStorage.getItem('view')||view}catch{}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
async function init(){const{data}=await sb.auth.getSession();data.session?home():auth()}
function auth(msg=''){app.innerHTML=`<h1>Card Ledger</h1><p class="mute">Sign in to see your collections and decks on every device.</p><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (6+ characters)"><p class="down">${esc(msg)}</p><button class="p" id="in">Sign in</button> <button id="up">Create account</button>`;
$('in').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});error?auth(error.message):home()};
$('up').onclick=async()=>{const{data,error}=await sb.auth.signUp({email:$('em').value,password:$('pw').value});error?auth(error.message):data.session?home():auth('Check your email to confirm, then sign in.')}}
const tabsHtml=()=>`<div class="top"><h1>Card Ledger</h1><button id="out">Sign out</button></div><div class="tabs"><button data-t="collection" class="${tab=='collection'?'on':''}">Collections</button><button data-t="deck" class="${tab=='deck'?'on':''}">Decks</button><button data-t="search" class="${tab=='search'?'on':''}">Find a card</button></div>`;
function bindTabs(){app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;home()});$('out').onclick=async()=>{await sb.auth.signOut();auth()}}
let lastQ='';
async function home(){cur=null;if(tab=='search')return finder();const deck=tab=='deck',nm=deck?'deck':'collection';
const{data}=await sb.from('collections').select('*').eq('kind',tab).order('created_at');
const rows=(data||[]).map(c=>`<div class="row">${c.thumb_id?`<img class="th" data-id="${c.id}" style="cursor:pointer" loading="lazy" alt="" src="${pic(c.thumb_id)}">`:'<div class="th"></div>'}<button class="link grow" data-id="${c.id}">${esc(c.name)}</button><button data-del="${c.id}" aria-label="Delete ${esc(c.name)}">Delete</button></div>`).join('')||`<p class="mute">No ${nm}s yet. Name your first one below.</p>`;
app.innerHTML=`${tabsHtml()}${rows}<p><input id="nm" placeholder="${deck?'New deck, e.g. Atraxa EDH':'New collection, e.g. Trade binder'}"><button class="p" id="mk">Create ${nm}</button>${deck?' <button id="imp">Import a deck</button>':''}</p>`;
bindTabs();
if(deck)$('imp').onclick=importScreen;
$('mk').onclick=async()=>{if($('nm').value.trim()){await sb.from('collections').insert({name:$('nm').value.trim(),kind:tab});home()}};
app.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(data.find(c=>c.id==b.dataset.id)));
app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm(`Delete this ${nm} and its cards?`)){await sb.from('collections').delete().eq('id',b.dataset.del);home()}})}
function importScreen(){app.innerHTML=`<div class="top"><button id="bk">Back to decks</button></div><h2>Import a deck</h2>
<p class="mute">Paste a Moxfield or Archidekt link, paste a deck list, or choose a text file. Sideboard and maybeboard cards are skipped.</p>
<input id="iu" autocomplete="off" placeholder="Moxfield or Archidekt link">
<textarea id="it" rows="8" placeholder="Or paste a deck list, one card per line, e.g. 1 Sol Ring"></textarea>
<div><input type="file" id="if" accept=".txt,.csv,text/plain"></div>
<input id="in" autocomplete="off" placeholder="Deck name (optional)">
<label><input type="checkbox" id="io" checked style="width:auto;margin:0 6px 0 0">I own these cards</label>
<p><button class="p" id="go">Import deck</button></p><div id="ir"></div>`;
$('bk').onclick=home;$('go').onclick=doImport;
$('if').onchange=async e=>{const f=e.target.files[0];if(f){$('it').value=await f.text();$('iu').value='';if(!$('in').value)$('in').value=f.name.replace(/\.[^.]+$/,'')}}}
async function doImport(){const url=$('iu').value.trim(),text=$('it').value.trim(),r=$('ir');let col=null;
if(!url&&!text){r.innerHTML='<p class="down">Paste a link or a deck list, or choose a file.</p>';return}
$('go').disabled=true;r.innerHTML='<p class="mute">Reading the deck and looking up each card. This can take a few seconds…</p>';
try{
const res=await fetch(SB_URL+'/functions/v1/import-deck',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY},body:JSON.stringify(url?{url}:{text})});
const j=await res.json();if(!res.ok||j.error)throw new Error(j.error||'The import failed. Please try again.');
if(!j.cards.length)throw new Error('No cards were found in that deck.');
const nm=$('in').value.trim()||j.name||'Imported deck';
const c1=await sb.from('collections').insert({name:nm,kind:'deck'}).select().single();if(c1.error)throw c1.error;col=c1.data;
const own=$('io').checked,m={};
j.cards.forEach(x=>{const k=x.c.id+'|'+x.finish+'|'+(x.board=='commander');if(m[k])m[k].q+=x.qty;else m[k]={x,q:x.qty}});
const L=Object.values(m),rows=L.map(({x,q})=>({collection_id:col.id,scryfall_id:x.c.id,finish:x.finish,qty:q,name:x.c.name,type_line:x.c.type_line,colors:x.c.colors,cmc:x.c.cmc,rarity:x.c.rarity,set_name:x.c.set_name,artist:x.c.artist,set_code:x.c.set,collector:x.c.collector_number,details:x.c.details,owned:own,is_commander:x.board=='commander'}));
for(let i=0;i<rows.length;i+=100){const e=await sb.from('entries').insert(rows.slice(i,i+100));if(e.error)throw e.error}
const day=new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'}),pm={};
L.forEach(({x})=>{if(x.c.price)pm[x.c.id+x.finish]={scryfall_id:x.c.id,finish:x.finish,snap_date:day,usd:x.c.price}});
if(Object.keys(pm).length)await sb.from('prices').upsert(Object.values(pm),{ignoreDuplicates:true,onConflict:'scryfall_id,finish,snap_date'});
const cmd=rows.find(x=>x.is_commander);if(cmd){await sb.from('collections').update({thumb_id:cmd.scryfall_id}).eq('id',col.id);col.thumb_id=cmd.scryfall_id}
const n=rows.reduce((a,x)=>a+x.qty,0);
r.innerHTML=`<p class="up"><b>Imported ${n} cards</b> (${rows.length} different) into “${esc(nm)}”.</p>${j.missing.length?`<p class="down">Couldn't find ${j.missing.length}: ${j.missing.map(t=>esc(t)).join(', ')}</p>`:''}${j.skipped?`<p class="mute">Skipped ${j.skipped} sideboard or maybeboard cards.</p>`:''}<button class="p" id="op">Open deck</button>`;
$('op').onclick=()=>open(col)
}catch(e){if(col)await sb.from('collections').delete().eq('id',col.id);r.innerHTML=`<p class="down">${esc(e.message||e)}</p>`;$('go').disabled=false}}
function finder(){app.innerHTML=`${tabsHtml()}<input id="fq" autocomplete="off" placeholder="Type a card name, e.g. Sol Ring" value="${esc(lastQ)}"><div id="fr"></div>`;bindTabs();
const run=async()=>{lastQ=$('fq').value.trim();const r=$('fr');if(lastQ.length<2){r.innerHTML='<p class="mute">Type at least 2 letters to search your collections and decks.</p>';return}
const[{data:es},{data:cs}]=await Promise.all([sb.from('entries').select('*').ilike('name','%'+lastQ.replace(/[%_]/g,'')+'%'),sb.from('collections').select('id,name,kind,thumb_id')]);
const cn=Object.fromEntries((cs||[]).map(c=>[c.id,c])),g={};(es||[]).forEach(e=>(g[e.name]??=[]).push(e));
const names=Object.keys(g).sort();
r.innerHTML=names.length?names.map(n=>{const L=g[n];return`<div class="row" data-sid="${L[0].scryfall_id}" style="align-items:flex-start"><img class="th" loading="lazy" alt="" src="${pic(L[0].scryfall_id)}"><div class="grow"><b>${esc(n)}</b> <span class="mute">· ${L.reduce((a,e)=>a+e.qty,0)} total in ${L.length} place${L.length>1?'s':''}</span>${L.map(e=>{const c=cn[e.collection_id]||{},dk=c.kind=='deck';return`<div><button class="link" data-go="${e.collection_id}">${esc(c.name)}</button> <span class="mute">${dk?'Deck':'Collection'} · ${esc(e.set_code).toUpperCase()} #${esc(e.collector)} · ${e.finish} · ×${e.qty}${dk&&e.owned===false?' · need to buy':''}${e.is_commander?' · commander':''}</span></div>`}).join('')}</div></div>`}).join(''):`<p class="mute">No card matching “${esc(lastQ)}” in your collections or decks.</p>`;
r.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>open(cn[b.dataset.go]))};
let t;$('fq').oninput=()=>{clearTimeout(t);t=setTimeout(run,250)};$('fq').onkeydown=e=>{if(e.key=='Enter')run()};if(lastQ)run();$('fq').focus()}
function spark(v){if(v.length<2)return'<svg class="sp"></svg>';const lo=Math.min(...v),hi=Math.max(...v),r=hi-lo||1;
const p=v.map((y,i)=>`${(i/(v.length-1)*62+1).toFixed(1)},${(18-(y-lo)/r*16).toFixed(1)}`).join(' ');
return`<svg class="sp" viewBox="0 0 64 20"><polyline points="${p}" fill="none" stroke="currentColor" stroke-width="1.6" class="${v.at(-1)>=v[0]?'up':'down'}"/></svg>`}
function chg(h,days){if(h.length<2)return null;const last=h.at(-1),cut=new Date(last.d);cut.setDate(cut.getDate()-days);
const base=[...h].reverse().find(x=>new Date(x.d)<=cut)||h[0];if(base===last)return null;return(last.usd-base.usd)/base.usd*100}
const fmt=p=>p==null?'':`<span class="${p>=0?'up':'down'}">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(1)}%</span>`;
async function open(c){cur=c;tab=c.kind;const deck=c.kind=='deck';try{grp=localStorage.getItem(deck?'group':'group_c')||(deck?'type':'none')}catch{grp=deck?'type':'none'}const{data:es}=await sb.from('entries').select('*').eq('collection_id',c.id).order('name');
const ids=[...new Set(es.map(e=>e.scryfall_id))];let ps=[];
if(ids.length){const r=await sb.from('prices').select('*').in('scryfall_id',ids).order('snap_date');ps=r.data||[]}
const H={};ps.forEach(p=>(H[p.scryfall_id+p.finish]??=[]).push({d:p.snap_date,usd:+p.usd}));

if(dk?.length){const dn=Object.fromEntries(dk.map(d=>[d.id,d.name])),{data:de}=await sb.from('entries').select('name,collection_id').in('collection_id',dk.map(d=>d.id)).in('name',[...new Set(es.map(e=>e.name))]);
(de||[]).forEach(x=>{(inD[x.name]??=new Set()).add(dn[x.collection_id])})}}
const decksFor=n=>`<div class="mute">${inD[n]?'In decks: '+[...inD[n]].map(d=>esc(d)).join(', '):'Not in any deck'}</div>`;
let total=0,need=0,needN=0;
const row=e=>{const h=H[e.scryfall_id+e.finish]||[],now=h.at(-1)?.usd,buy=deck&&e.owned===false;if(now){total+=now*e.qty;if(buy)need+=now*e.qty}if(buy)needN+=e.qty;
const tb=`<button class="sm" data-th="${e.id}">${c.thumb_id==e.scryfall_id?'Unset thumbnail':'Set as thumbnail'}</button>`;
const x=`<div>${deck?`<button class="sm ${buy?'down':''}" data-own="${e.id}">${buy?'Need to buy':'Owned'}</button> <button class="sm" data-cmd="${e.id}">${e.is_commander?'Unset commander':'Make commander'}</button> `:''}${tb}</div>`;
if(view=='grid')return`<div class="gc"><img class="gi" loading="lazy" alt="${esc(e.name)}" src="${big(e.scryfall_id)}"><div class="gp"><button class="pbtn" data-hist="${e.id}" aria-label="Price history for ${esc(e.name)}">${money(now)}</button> <span class="mute">${fmt(chg(h,7))||'new'} wk</span></div><div class="mute gn"><b>${esc(e.name)}</b><br>${esc(e.set_code).toUpperCase()} #${esc(e.collector)} · ${e.finish}${e.details?' · '+esc(e.details):''}</div>${x}${deck?'':decksFor(e.name)}<div class="gq"><button data-q="${e.id}:-1" aria-label="Remove one">−</button> ${e.qty} <button data-q="${e.id}:1" aria-label="Add one">+</button></div></div>`;
return`<div class="row" data-sid="${e.scryfall_id}">${view=='text'?'':`<img class="th" loading="lazy" alt="" src="${pic(e.scryfall_id)}">`}<div class="grow"><b>${esc(e.name)}</b><div class="mute">${esc(e.set_code).toUpperCase()} #${esc(e.collector)} · ${e.finish}${e.details?' · '+esc(e.details):''}</div>${x}${deck?'':decksFor(e.name)}</div>
${view=='text'?'':spark(h.map(y=>y.usd))}<div class="num"><button class="pbtn" data-hist="${e.id}" aria-label="Price history for ${esc(e.name)}">${money(now)}</button><div class="mute">${fmt(chg(h,7))||'new'} wk · ${fmt(chg(h,28))||'–'} 4wk</div></div>
<div><button data-q="${e.id}:-1" aria-label="Remove one">−</button> ${e.qty} <button data-q="${e.id}:1" aria-label="Add one">+</button></div></div>`};
const srtd=a=>[...a].sort(cmpFor());
const wrap=a=>a.length?(view=='grid'?`<div class="grid">${srtd(a).map(row).join('')}</div>`:srtd(a).map(row).join('')):'';
const cm=es.filter(e=>e.is_commander),rest=es.filter(e=>!e.is_commander);
const groups=a=>{const g={};a.forEach(e=>{const k=keyOf(e);(g[k]??={k,s:sortOf(e,k),a:[]}).a.push(e)});
return Object.values(g).sort((x,y)=>typeof x.s=='number'&&typeof y.s=='number'?x.s-y.s:String(x.s).localeCompare(String(y.s)))};
const gh=a=>groups(a).map(({k,a})=>`<h3>${esc(k)} <span class="mute">(${a.reduce((n,e)=>n+e.qty,0)})</span></h3>${wrap(a)}`).join('');
const cats=!rest.length?'<p class="mute">No other cards yet.</p>':grp=='none'?`<h3>Main deck</h3>${wrap(rest)}`:gh(rest);
const gdd=dd('Group',GL,grp,'data-g'),sdd=dd('Sort',SL,srt,'data-s');
const body=deck?`<h3>Commander</h3>${wrap(cm)||'<p class="mute">No commander yet. Tap “Make commander” on a card below.</p>'}${cats}`:(es.length?(grp=='none'?wrap(es):gh(es)):'<p class="mute">Empty. Use “Add card” to search by name and pick a printing.</p>');
const n=es.reduce((a,e)=>a+e.qty,0);
const info=deck?`<div class="mute"><b class="${n==100?'up':n>100?'down':''}">${n} / 100 cards</b> · ${n<100?(100-n)+' to go':n>100?(n-100)+' over':'deck is full'}</div><div class="mute">${needN?`Still need ${needN} card${needN>1?'s':''} · ${money(need)} to buy`:'You own every card in this deck'}</div>`:`<div class="mute">${n} cards, latest prices</div>`;
app.innerHTML=`<div class="top"><button id="bk">Back to ${deck?'decks':'collections'}</button><button class="p" id="ad">Add card</button></div><h2>${esc(c.name)}</h2><div class="total">${money(total)}</div>${info}${dd('Display',[['list','List'],['grid','Grid'],['text','Text only']],view,'data-v')}${gdd}${sdd}${body}`;
app.querySelectorAll('[data-hist]').forEach(b=>b.onclick=()=>{const e=es.find(x=>x.id==b.dataset.hist);showHist(e,H[e.scryfall_id+e.finish]||[])});
app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;try{localStorage.setItem('view',view)}catch{}open(c)});
app.querySelectorAll('[data-th]').forEach(b=>b.onclick=async()=>{const e=es.find(x=>x.id==b.dataset.th),id=c.thumb_id==e.scryfall_id?null:e.scryfall_id;await sb.from('collections').update({thumb_id:id}).eq('id',c.id);c.thumb_id=id;open(c)});
app.querySelectorAll('.dd>button').forEach(b=>b.onclick=()=>{const m=b.nextElementSibling;closeMenus(m);m.hidden=!m.hidden;if(!m.hidden){m.style.left='0';m.style.right='auto';if(m.getBoundingClientRect().right>innerWidth-8){m.style.left='auto';m.style.right='0'}}b.setAttribute('aria-expanded',String(!m.hidden))});
app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{srt=b.dataset.s;try{localStorage.setItem('sort',srt)}catch{}open(c)});
app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{grp=b.dataset.g;try{localStorage.setItem(deck?'group':'group_c',grp)}catch{}open(c)});
$('bk').onclick=home;$('ad').onclick=search;
app.querySelectorAll('[data-q]').forEach(b=>b.onclick=async()=>{const[id,d]=b.dataset.q.split(':'),e=es.find(x=>x.id==id),q=e.qty+ +d;
q<1?await sb.from('entries').delete().eq('id',id):await sb.from('entries').update({qty:q}).eq('id',id);open(c)});
app.querySelectorAll('[data-own]').forEach(b=>b.onclick=async()=>{const e=es.find(x=>x.id==b.dataset.own);await sb.from('entries').update({owned:e.owned===false}).eq('id',e.id);open(c)});
app.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=async()=>{const e=es.find(x=>x.id==b.dataset.cmd);await sb.from('entries').update({is_commander:!e.is_commander}).eq('id',e.id);open(c)})}
function showHist(e,h){document.getElementById('hm')?.remove();
const rev=[...h].reverse(),rows=rev.map((x,i)=>{const p=rev[i+1],d=p?x.usd-p.usd:null;return`<tr><td>${esc(x.d)}</td><td class="num">${money(x.usd)}</td><td class="num ${d>0?'up':d<0?'down':''}">${!d?'–':(d>0?'+':'−')+'$'+Math.abs(d).toFixed(2)}</td></tr>`}).join('');
const m=document.createElement('div');m.id='hm';
m.innerHTML=`<div role="dialog" aria-modal="true" aria-label="Price history"><b>${esc(e.name)}</b><div class="mute">${esc(e.set_code).toUpperCase()} #${esc(e.collector)} · ${e.finish}</div><div class="sc">${h.length?`<table><thead><tr><th>Date</th><th class="num">Price</th><th class="num">Change</th></tr></thead><tbody>${rows}</tbody></table>`:'<p class="mute">No prices recorded yet. A price is saved when you add the card, then every week.</p>'}</div><div class="top"><button id="hcsv">Download CSV</button><button class="p" id="hx">Close</button></div></div>`;
document.body.appendChild(m);
const close=()=>{m.remove();document.removeEventListener('keydown',onKey)},onKey=ev=>{if(ev.key=='Escape')close()};
document.addEventListener('keydown',onKey);m.onclick=ev=>{if(ev.target==m)close()};$('hx').onclick=close;$('hx').focus();
$('hcsv').onclick=()=>{const csv='Date,Price (USD)\n'+h.map(x=>x.d+','+x.usd.toFixed(2)).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=(e.name+' '+e.set_code+' '+e.finish+' prices.csv').replace(/[^\w. -]/g,'');a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}
function search(){app.innerHTML=`<div class="top"><button id="bk">Back to ${esc(cur.name)}</button></div><h2>Add a card</h2>${cur.kind=='deck'?'<label><input type="checkbox" id="own" checked style="width:auto;margin:0 6px 0 0">I own these cards</label>':''}<input id="q" autocomplete="off" placeholder="Exact card name, e.g. Sol Ring"><button class="p" id="go">Find printings</button><div id="res"></div>`;
$('bk').onclick=()=>open(cur);$('go').onclick=find;$('q').onkeydown=e=>{if(e.key=='Enter')find()}}
async function find(){const n=$('q').value.trim(),res=$('res');if(!n)return;res.innerHTML='<p class="mute">Searching…</p>';
const url=q=>`https://api.scryfall.com/cards/search?unique=prints&order=released&include_extras=true&q=${encodeURIComponent(q)}`;
let r=await fetch(url(`!"${n}"`));if(!r.ok)r=await fetch(url(n));
if(!r.ok){res.innerHTML='<p class="down">No cards found. Check the spelling and try again.</p>';return}
const cards=(await r.json()).data;window._c=cards;
res.innerHTML=cards.map((c,i)=>{const d=[c.full_art&&'full art',c.border_color=='borderless'&&'borderless',c.promo&&'promo',...(c.frame_effects||[])].filter(Boolean).join(', ');
return`<div class="row" data-sid="${c.id}"><img class="th" loading="lazy" alt="" src="${pic(c.id)}"><div class="grow"><b>${esc(c.name)}</b><div class="mute">${esc(c.set_name)} (${c.set.toUpperCase()}) #${esc(c.collector_number)}${d?' · '+esc(d):''}</div></div>
${c.finishes.map(f=>`<button data-a="${i}:${f}">${f} ${money(+c.prices[COL[f]]||null)}</button>`).join(' ')}</div>`}).join('');
res.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>add(b))}
async function add(b){const[i,f]=b.dataset.a.split(':'),c=window._c[i];b.disabled=true;
const{data:ex}=await sb.from('entries').select('id,qty').eq('collection_id',cur.id).eq('scryfall_id',c.id).eq('finish',f);
if(ex?.length)await sb.from('entries').update({qty:ex[0].qty+1}).eq('id',ex[0].id);
else await sb.from('entries').insert({collection_id:cur.id,scryfall_id:c.id,finish:f,owned:$('own')?$('own').checked:true,name:c.name,type_line:c.type_line||c.card_faces?.[0]?.type_line||null,colors:(c.colors||c.card_faces?.[0]?.colors||[]).join(','),cmc:c.cmc,rarity:c.rarity,set_name:c.set_name,artist:c.artist||c.card_faces?.[0]?.artist||null,set_code:c.set,collector:c.collector_number,
details:[c.full_art&&'full art',c.border_color=='borderless'&&'borderless',c.promo&&'promo'].filter(Boolean).join(', ')});
const p=+c.prices[COL[f]];if(p)await sb.from('prices').upsert({scryfall_id:c.id,finish:f,snap_date:new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'}),usd:p},{ignoreDuplicates:true});
b.textContent='Added ✓'}
const pv=document.getElementById('pv'),big=id=>`https://cards.scryfall.io/normal/front/${id[0]}/${id[1]}/${id}.jpg`;
app.addEventListener('mouseover',e=>{const r=e.target.closest('[data-sid]');if(r){pv.src=big(r.dataset.sid);pv.style.display='block'}else pv.style.display='none'});
app.addEventListener('mousemove',e=>{if(pv.style.display=='block'){pv.style.left=Math.min(e.clientX+20,innerWidth-264)+'px';pv.style.top=Math.max(8,Math.min(e.clientY-170,innerHeight-350))+'px'}});
app.addEventListener('mouseleave',()=>pv.style.display='none');
const tb=document.getElementById('top');
addEventListener('scroll',()=>tb.classList.toggle('show',scrollY>300),{passive:true});
tb.onclick=()=>scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
const closeMenus=ex=>document.querySelectorAll('.ddm').forEach(m=>{if(m!==ex){m.hidden=true;m.previousElementSibling.setAttribute('aria-expanded','false')}});
document.addEventListener('click',e=>{if(!e.target.closest('.dd'))closeMenus()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeMenus()});
init();
</script></body></html>
