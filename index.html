app.querySelectorAll('[data-th]').forEach(b=>b.onclick=async()=>{const e=es.find(x=>x.id==b.dataset.th),id=c.thumb_id==e.scryfall_id?null:e.scryfall_id;await sb.from('collections').update({thumb_id:id}).eq('id',c.id);c.thumb_id=id;reopen(c)});
app.querySelectorAll('.dd>button').forEach(b=>b.onclick=()=>{const m=b.nextElementSibling;closeMenus(m);m.hidden=!m.hidden;if(!m.hidden){m.style.left='0';m.style.right='auto';if(m.getBoundingClientRect().right>innerWidth-8){m.style.left='auto';m.style.right='0'}}b.setAttribute('aria-expanded',String(!m.hidden))});
app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{srt=b.dataset.s;try{localStorage.setItem('sort',srt)}catch{}open(c)});
app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{grp=b.dataset.g;try{localStorage.setItem(deck?'group':'group_c',grp)}catch{}open(c)});
$('bk').onclick=home;$('ad').onclick=()=>{ret=scrollY;search()};
app.querySelectorAll('[data-q]').forEach(b=>b.onclick=async()=>{const[id,d]=b.dataset.q.split(':'),e=es.find(x=>x.id==id),q=e.qty+ +d;
q<1?await sb.from('entries').delete().eq('id',id):await sb.from('entries').update({qty:q}).eq('id',id);reopen(c)});
app.querySelectorAll('[data-own]').forEach(b=>b.onchange=async()=>{await sb.from('entries').update({ownership:b.value}).eq('id',b.dataset.own);reopen(c)});
app.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=async()=>{const e=es.find(x=>x.id==b.dataset.cmd);await sb.from('entries').update({is_commander:!e.is_commander}).eq('id',e.id);reopen(c)})}
function showHist(e,h){document.getElementById('hm')?.remove();
const rev=[...h].reverse(),rows=rev.map((x,i)=>{const p=rev[i+1],d=p?x.usd-p.usd:null;return`<tr><td>${esc(x.d)}</td><td class="num">${money(x.usd)}</td><td class="num ${d>0?'up':d<0?'down':''}">${!d?'–':(d>0?'+':'−')+'$'+Math.abs(d).toFixed(2)}</td></tr>`}).join('');
const m=document.createElement('div');m.id='hm';
m.innerHTML=`<div role="dialog" aria-modal="true" aria-label="Price history"><b>${esc(e.name)}</b><div class="mute">${esc(e.set_code).toUpperCase()} #${esc(e.collector)} · ${e.finish}</div><div class="sc">${h.length?`<table><thead><tr><th>Date</th><th class="num">Price</th><th class="num">Change</th></tr></thead><tbody>${rows}</tbody></table>`:'<p class="mute">No prices recorded yet. A price is saved when you add the card, then every week.</p>'}</div><div class="top"><button id="hcsv">Download CSV</button><button class="p" id="hx">Close</button></div></div>`;
document.body.appendChild(m);
const close=()=>{m.remove();document.removeEventListener('keydown',onKey)},onKey=ev=>{if(ev.key=='Escape')close()};
document.addEventListener('keydown',onKey);m.onclick=ev=>{if(ev.target==m)close()};$('hx').onclick=close;$('hx').focus();
$('hcsv').onclick=()=>{const csv='Date,Price (USD)\n'+h.map(x=>x.d+','+x.usd.toFixed(2)).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=(e.name+' '+e.set_code+' '+e.finish+' prices.csv').replace(/[^\w. -]/g,'');a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}
function search(){scrollTo(0,0);app.innerHTML=`<div class="top"><button id="bk">Back to ${esc(cur.name)}</button></div><h2>Add a card</h2>${cur.kind=='deck'?'<label><input type="checkbox" id="own" checked style="width:auto;margin:0 6px 0 0">I own these cards</label> <label style="margin-left:12px">Add to <select id="ab" class="sm"><option value="main">Main Deck</option><option value="side">Sideboard</option></select></label>':''}<input id="q" autocomplete="off" placeholder="Exact card name, e.g. Sol Ring"><button class="p" id="go">Find printings</button><div id="res"></div>`;
$('bk').onclick=()=>open(cur);$('go').onclick=find;$('q').onkeydown=e=>{if(e.key=='Enter')find()}}
async function find(){const n=$('q').value.trim(),res=$('res');if(!n)return;res.innerHTML='<p class="mute">Searching…</p>';
const url=q=>`https://api.scryfall.com/cards/search?unique=prints&order=released&include_extras=true&q=${encodeURIComponent(q)}`;
let r=await fetch(url(`!"${n}"`));if(!r.ok)r=await fetch(url(n));
if(!r.ok){res.innerHTML='<p class="down">No cards found. Check the spelling and try again.</p>';return}
const cards=(await r.json()).data;window._c=cards;
res.innerHTML=cards.map((c,i)=>{const d=[c.full_art&&'full art',c.border_color=='borderless'&&'borderless',c.promo&&'promo',...(c.frame_effects||[])].filter(Boolean).join(', ');
return`<div class="row" data-sid="${c.id}">${thumb(c.id,c.layout,0)}<div class="grow"><b>${esc(c.name)}</b><div class="mute">${esc(c.set_name)} (${c.set.toUpperCase()}) #${esc(c.collector_number)}${d?' · '+esc(d):''}</div></div>
${c.finishes.map(f=>`<button data-a="${i}:${f}">${f} ${money(+c.prices[COL[f]]||null)}</button>`).join(' ')}</div>`}).join('');
res.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>add(b))}
async function add(b){const[i,f]=b.dataset.a.split(':'),c=window._c[i];b.disabled=true;const bd=$('ab')?$('ab').value:'main';
const{data:ex}=await sb.from('entries').select('id,qty').eq('collection_id',cur.id).eq('scryfall_id',c.id).eq('finish',f).eq('board',bd);
if(ex?.length)await sb.from('entries').update({qty:ex[0].qty+1}).eq('id',ex[0].id);
else await sb.from('entries').insert({collection_id:cur.id,scryfall_id:c.id,finish:f,board:bd,...extraOf(c),ownership:$('own')&&!$('own').checked?'need':'owned',name:c.name,type_line:c.type_line||c.card_faces?.[0]?.type_line||null,colors:(c.colors||c.card_faces?.[0]?.colors||[]).join(','),cmc:c.cmc,rarity:c.rarity,set_name:c.set_name,artist:c.artist||c.card_faces?.[0]?.artist||null,set_code:c.set,collector:c.collector_number,
details:[c.full_art&&'full art',c.border_color=='borderless'&&'borderless',c.promo&&'promo'].filter(Boolean).join(', ')});
const p=+c.prices[COL[f]];if(p)await sb.from('prices').upsert({scryfall_id:c.id,finish:f,snap_date:new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'}),usd:p},{ignoreDuplicates:true});
b.textContent='Added ✓'}
const pv=document.getElementById('pv'),big=id=>`https://cards.scryfall.io/normal/front/${id[0]}/${id[1]}/${id}.jpg`;
const place=e=>{pv.style.left=Math.min(e.clientX+20,innerWidth-264)+'px';pv.style.top=Math.max(8,Math.min(e.clientY-170,innerHeight-350))+'px'};
const pvShow=e=>{const t=e.target.closest('.th,.gi,[data-sid] b'),r=t&&t.closest('[data-sid]');if(r){pv.src=big(r.dataset.sid);place(e);pv.style.display='block'}else pv.style.display='none'};
app.addEventListener('mouseover',pvShow);app.addEventListener('click',pvShow);
app.addEventListener('mousemove',e=>{if(pv.style.display=='block')place(e)});
app.addEventListener('click',e=>{const b=e.target.closest('[data-flip]');if(!b)return;const im=b.parentElement.querySelector('img'),back=im.src.includes('/back/');im.onerror=()=>{im.onerror=null;im.src=im.src.replace('/back/','/front/')};im.src=back?im.src.replace('/back/','/front/'):im.src.replace('/front/','/back/')});
app.addEventListener('mouseleave',()=>pv.style.display='none');
const tb=document.getElementById('top');
addEventListener('scroll',()=>tb.classList.toggle('show',scrollY>300),{passive:true});
tb.onclick=()=>scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
const closeMenus=ex=>document.querySelectorAll('.ddm').forEach(m=>{if(m!==ex){m.hidden=true;m.previousElementSibling.setAttribute('aria-expanded','false')}});
document.addEventListener('click',e=>{if(!e.target.closest('.dd'))closeMenus()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeMenus()});
init();
</script></body></html>
