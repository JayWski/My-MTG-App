<!doctype html><html lang="en"><head><meta charset="utf-8"><title>My MTG App</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#14202b">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#14202b;--mute:#5b6b78;--line:#d5dce2;--up:#1f8a5b;--down:#c2402f;--acc:#14202b}
@media(prefers-color-scheme:dark){:root{--bg:#0e171e;--panel:#17242e;--ink:#e9e5da;--mute:#8fa0ad;--line:#27384580;--up:#4cc58d;--down:#ef7a69;--acc:#e9e5da}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}h1,h2{font-family:Georgia,serif;font-weight:600;margin:.2em 0}
button,input{font:inherit;color:inherit}input{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);margin:4px 0}
button{padding:8px 12px;border:1px solid var(--ink);background:none;border-radius:6px;cursor:pointer}button.p{background:var(--acc);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--up);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.grow{flex:1;min-width:0}
.mute{color:var(--mute);font-size:13px}.up{color:var(--up)}.down{color:var(--down)}.num{text-align:right;font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.total{font:600 28px Georgia,serif}
svg.sp{width:64px;height:20px;flex:none}.link{border:0;padding:0;text-align:left;font-weight:600}
</style></head><body><main id="app"></main>
<script>
const SB_URL='https://wihratryjsmcbpsistkj.supabase.co',SB_KEY='sb_publishable_6k9ibJeQe9iDIxYOCxgPPA_tJTjth8f';
const sb=supabase.createClient(SB_URL,SB_KEY),app=document.getElementById('app');
const COL={nonfoil:'usd',foil:'usd_foil',etched:'usd_etched'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id),money=n=>n==null?'–':'$'+n.toFixed(2);
let cur=null;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
async function init(){const{data}=await sb.auth.getSession();data.session?home():auth()}
function auth(msg=''){app.innerHTML=`<h1>Card Ledger</h1><p class="mute">Sign in to see your collections on every device.</p><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (6+ characters)"><p class="down">${esc(msg)}</p><button class="p" id="in">Sign in</button> <button id="up">Create account</button>`;
$('in').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});error?auth(error.message):home()};
$('up').onclick=async()=>{const{data,error}=await sb.auth.signUp({email:$('em').value,password:$('pw').value});error?auth(error.message):data.session?home():auth('Check your email to confirm, then sign in.')}}
async function home(){cur=null;const{data}=await sb.from('collections').select('*').order('created_at');
app.innerHTML=`<div class="top"><h1>Collections</h1><button id="out">Sign out</button></div>${(data||[]).map(c=>`<div class="row"><button class="link grow" data-id="${c.id}">${esc(c.name)}</button><button data-del="${c.id}" aria-label="Delete ${esc(c.name)}">Delete</button></div>`).join('')||'<p class="mute">No collections yet. Name your first one below.</p>'}
<p><input id="nm" placeholder="New collection, e.g. Atraxa EDH"><button class="p" id="mk">Create collection</button></p>`;
$('out').onclick=async()=>{await sb.auth.signOut();auth()};
$('mk').onclick=async()=>{if($('nm').value.trim()){await sb.from('collections').insert({name:$('nm').value.trim()});home()}};
app.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(data.find(c=>c.id==b.dataset.id)));
app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this collection and its cards?')){await sb.from('collections').delete().eq('id',b.dataset.del);home()}})}
function spark(v){if(v.length<2)return'<svg class="sp"></svg>';const lo=Math.min(...v),hi=Math.max(...v),r=hi-lo||1;
const p=v.map((y,i)=>`${(i/(v.length-1)*62+1).toFixed(1)},${(18-(y-lo)/r*16).toFixed(1)}`).join(' ');
return`<svg class="sp" viewBox="0 0 64 20"><polyline points="${p}" fill="none" stroke="currentColor" stroke-width="1.6" class="${v.at(-1)>=v[0]?'up':'down'}"/></svg>`}
function chg(h,days){if(h.length<2)return null;const last=h.at(-1),cut=new Date(last.d);cut.setDate(cut.getDate()-days);
let base=[...h].reverse().find(x=>new Date(x.d)<=cut)||h[0];if(base===last)return null;return(last.usd-base.usd)/base.usd*100}
const fmt=p=>p==null?'':`<span class="${p>=0?'up':'down'}">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(1)}%</span>`;
async function open(c){cur=c;const{data:es}=await sb.from('entries').select('*').eq('collection_id',c.id).order('name');
const ids=[...new Set(es.map(e=>e.scryfall_id))];let ps=[];
if(ids.length){const r=await sb.from('prices').select('*').in('scryfall_id',ids).order('snap_date');ps=r.data||[]}
const H={};ps.forEach(p=>(H[p.scryfall_id+p.finish]??=[]).push({d:p.snap_date,usd:+p.usd}));
let total=0;const rows=es.map(e=>{const h=H[e.scryfall_id+e.finish]||[],now=h.at(-1)?.usd;if(now)total+=now*e.qty;
return`<div class="row"><div class="grow"><b>${esc(e.name)}</b><div class="mute">${esc(e.set_code).toUpperCase()} #${esc(e.collector)} · ${e.finish}${e.details?' · '+esc(e.details):''}</div></div>
${spark(h.map(x=>x.usd))}<div class="num">${money(now)}<div class="mute">${fmt(chg(h,7))||'new'} wk · ${fmt(chg(h,28))||'–'} 4wk</div></div>
<div><button data-q="${e.id}:-1" aria-label="Remove one">−</button> ${e.qty} <button data-q="${e.id}:1" aria-label="Add one">+</button></div></div>`}).join('');
app.innerHTML=`<div class="top"><button id="bk">Back</button><button class="p" id="ad">Add card</button></div><h2>${esc(c.name)}</h2><div class="total">${money(total)}</div><div class="mute">${es.reduce((a,e)=>a+e.qty,0)} cards, latest prices</div>${rows||'<p class="mute">Empty. Use “Add card” to search by name and pick a printing.</p>'}`;
$('bk').onclick=home;$('ad').onclick=search;
app.querySelectorAll('[data-q]').forEach(b=>b.onclick=async()=>{const[id,d]=b.dataset.q.split(':'),e=es.find(x=>x.id==id),q=e.qty+ +d;
q<1?await sb.from('entries').delete().eq('id',id):await sb.from('entries').update({qty:q}).eq('id',id);open(c)})}
function search(){app.innerHTML=`<div class="top"><button id="bk">Back to ${esc(cur.name)}</button></div><h2>Add a card</h2><input id="q" type="search" name="cardsearch" autocomplete="off" placeholder="Exact card name, e.g. Sol Ring"><button class="p" id="go">Find printings</button><div id="res"></div>`;
$('bk').onclick=()=>open(cur);$('go').onclick=find;$('q').onkeydown=e=>{if(e.key=='Enter')find()}}
async function find(){const n=$('q').value.trim(),res=$('res');if(!n)return;res.innerHTML='<p class="mute">Searching…</p>';
const url=q=>`https://api.scryfall.com/cards/search?unique=prints&order=released&include_extras=true&q=${encodeURIComponent(q)}`;
let r=await fetch(url(`!"${n}"`));if(!r.ok)r=await fetch(url(n));
if(!r.ok){res.innerHTML='<p class="down">No cards found. Check the spelling and try again.</p>';return}
const cards=(await r.json()).data;window._c=cards;
res.innerHTML=cards.map((c,i)=>{const d=[c.full_art&&'full art',c.border_color=='borderless'&&'borderless',c.promo&&'promo',...(c.frame_effects||[])].filter(Boolean).join(', ');
return`<div class="row"><div class="grow"><b>${esc(c.name)}</b><div class="mute">${esc(c.set_name)} (${c.set.toUpperCase()}) #${esc(c.collector_number)}${d?' · '+esc(d):''}</div></div>
${c.finishes.map(f=>`<button data-a="${i}:${f}">${f} ${money(+c.prices[COL[f]]||null)}</button>`).join(' ')}</div>`}).join('');
res.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>add(b))}
async function add(b){const[i,f]=b.dataset.a.split(':'),c=window._c[i];b.disabled=true;
const{data:ex}=await sb.from('entries').select('id,qty').eq('collection_id',cur.id).eq('scryfall_id',c.id).eq('finish',f);
if(ex?.length)await sb.from('entries').update({qty:ex[0].qty+1}).eq('id',ex[0].id);
else await sb.from('entries').insert({collection_id:cur.id,scryfall_id:c.id,finish:f,name:c.name,set_code:c.set,collector:c.collector_number,
details:[c.full_art&&'full art',c.border_color=='borderless'&&'borderless',c.promo&&'promo'].filter(Boolean).join(', ')});
const p=+c.prices[COL[f]];if(p)await sb.from('prices').upsert({scryfall_id:c.id,finish:f,snap_date:new Date().toISOString().slice(0,10),usd:p},{ignoreDuplicates:true});
b.textContent='Added ✓'}
init();
</script></body></html>
