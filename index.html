function showHist(e,h){document.getElementById('hm')?.remove();
const rev=[...h].reverse(),rows=rev.map((x,i)=>{const p=rev[i+1],d=p?x.usd-p.usd:null;return`<tr><td>${esc(x.d)}</td><td class="num">${money(x.usd)}</td><td class="num ${d>0?'up':d<0?'down':''}">${!d?'–':(d>0?'+':'−')+'$'+Math.abs(d).toFixed(2)}</td></tr>`}).join('');
const m=document.createElement('div');m.id='hm';
m.innerHTML=`<div role="dialog" aria-modal="true" aria-label="Price history"><b>${esc(e.name)}</b><div class="mute">${esc(e.set_code).toUpperCase()} #${esc(e.collector)} · ${e.finish}</div><div class="sc">${h.length?`<table><thead><tr><th>Date</th><th class="num">Price</th><th class="num">Change</th></tr></thead><tbody>${rows}</tbody></table>`:'<p class="mute">No prices recorded yet. A price is saved when you add the card, then every week.</p>'}</div><div class="top"><button id="hcsv">Download CSV</button><button class="p" id="hx">Close</button></div></div>`;
document.body.appendChild(m);
const close=()=>{m.remove();document.removeEventListener('keydown',onKey)},onKey=ev=>{if(ev.key=='Escape')close()};
document.addEventListener('keydown',onKey);m.onclick=ev=>{if(ev.target==m)close()};$('hx').onclick=close;$('hx').focus();
$('hcsv').onclick=()=>{const csv='Date,Price (USD)\n'+h.map(x=>x.d+','+x.usd.toFixed(2)).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=(e.name+' '+e.set_code+' '+e.finish+' prices.csv').replace(/[^\w. -]/g,'');a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}
function showPrintings(res,cards,rowFn,bindFn,owned){
const m=new Map();cards.forEach(k=>{if(!m.has(k.set))m.set(k.set,{n:k.set_name,d:k.released_at||''})});
const sets=[...m.entries()].sort((a,b)=>b[1].d.localeCompare(a[1].d)),sel=new Set();let only=false;
res.innerHTML=`<div class="dg" style="flex-wrap:wrap;row-gap:6px"><span class="dl">Sets:</span><div class="dd"><button aria-haspopup="true" aria-expanded="false"></button><div class="ddm setm" role="group" aria-label="Choose sets" hidden><div class="sq"><input type="search" data-sq="1" placeholder="Search sets by name or code" autocomplete="off" aria-label="Search sets"><button class="sm" data-stclear="1">Show all sets</button></div>${sets.map(([cd,o])=>`<label class="ck"><input type="checkbox" data-st="${esc(cd)}" data-nm="${esc((o.n+' '+cd).toLowerCase())}"> ${esc(o.n)} (${esc(cd.toUpperCase())})</label>`).join('')}<p class="mute" data-nos hidden style="padding:6px 10px">No sets match.</p></div></div>${owned?'<label class="ck2"><input type="checkbox" data-mine="1"> Only printings I already have</label>':''}<span class="mute" data-cnt></span></div><div class="rl"></div>`;
const btn=res.querySelector('.dd>button'),menu=res.querySelector('.ddm'),list=res.querySelector('.rl'),cnt=res.querySelector('[data-cnt]');
const sq=menu.querySelector('[data-sq]'),nos=menu.querySelector('[data-nos]');
const filt=()=>{const t=sq.value.trim().toLowerCase();let any=false;menu.querySelectorAll('[data-st]').forEach(i=>{const show=!t||i.dataset.nm.includes(t);i.parentElement.hidden=!show;if(show)any=true});nos.hidden=any};
const draw=()=>{const vis=cards.map((k,i)=>[k,i]).filter(([k])=>(!sel.size||sel.has(k.set))&&(!only||owned.has(k.id)));
list.innerHTML=vis.map(([k,i])=>rowFn(k,i)).join('')||'<p class="mute">No printings match these choices.</p>';
const nm=sel.size==0?'All sets':sel.size==1?esc(m.get([...sel][0]).n):sel.size+' sets';
btn.innerHTML=nm+' ▾';cnt.textContent=vis.length+' of '+cards.length+' printings';bindFn(list)};
btn.onclick=()=>{menu.hidden=!menu.hidden;btn.setAttribute('aria-expanded',String(!menu.hidden))};
menu.querySelectorAll('[data-st]').forEach(i=>i.onchange=()=>{if(i.checked)sel.add(i.dataset.st);else sel.delete(i.dataset.st);draw()});
sq.oninput=filt;
sq.onkeydown=ev=>{if(ev.key=='Enter'){ev.preventDefault();const f=[...menu.querySelectorAll('[data-st]')].find(i=>!i.parentElement.hidden);if(f){f.checked=!f.checked;f.onchange();sq.value='';filt()}}};
menu.querySelector('[data-stclear]').onclick=()=>{sel.clear();menu.querySelectorAll('[data-st]').forEach(i=>i.checked=false);sq.value='';filt();draw()};
const oc=owned?res.querySelector('[data-mine]'):null;if(oc)oc.onchange=()=>{only=oc.checked;draw()};
draw()}
async function ownedPrintings(cards){const names=[...new Set(cards.map(k=>k.name))],out=new Set();if(!names.length)return out;
const cs=await sb.from('collections').select('id').eq('kind','collection'),ids=(cs.data||[]).map(x=>x.id);if(!ids.length)return out;
for(let i=0;i<names.length;i+=40){const r=await sb.from('entries').select('scryfall_id').in('collection_id',ids).in('name',names.slice(i,i+40));(r.data||[]).forEach(x=>out.add(x.scryfall_id))}
return out}
function search(){scrollTo(0,0);window._added={};app.innerHTML=`<div class="top"><button id="bk">Back to ${esc(cur.name)}</button></div><h2>Add a card</h2>${cur.kind=='deck'?'<label><input type="checkbox" id="own" checked style="width:auto;margin:0 6px 0 0">I own these cards</label> <label style="margin-left:12px">Add to <select id="ab" class="sm"><option value="main">Main Deck</option><option value="side">Sideboard</option></select></label>':''}<input id="q" autocomplete="off" placeholder="Exact card name, e.g. Sol Ring"><button class="p" id="go">Find printings</button><div id="res"></div>`;

async function find(){const n=$('q').value.trim(),res=$('res');if(!n)return;res.innerHTML='<p class="mute">Searching…</p>';
const url=q=>`https://api.scryfall.com/cards/search?unique=prints&order=released&include_extras=true&q=${encodeURIComponent(q)}`;
let r=await fetch(url(`!"${n}"`));if(!r.ok)r=await fetch(url(n));
if(!r.ok){res.innerHTML='<p class="down">No cards found. Check the spelling and try again.</p>';return}
const cards=(await r.json()).data;window._c=cards;
const rowFn=(c,i)=>{const d=[c.full_art&&'full art',c.border_color=='borderless'&&'borderless',c.promo&&'promo',...(c.frame_effects||[])].filter(Boolean).join(', ');
return`<div class="row" data-sid="${c.id}">${thumb(c.id,c.layout,0)}<div class="grow"><b>${esc(c.name)}</b><div class="mute">${esc(c.set_name)} (${c.set.toUpperCase()}) #${esc(c.collector_number)}${d?' · '+esc(d):''}</div></div>
${c.finishes.map(f=>{const on=(window._added||{})[c.id+'|'+f];return`<button data-a="${i}:${f}" aria-pressed="${!!on}">${on?'✓ Added · tap to remove':f+' '+money(+c.prices[COL[f]]||null)}</button>`}).join(' ')}</div>`};
showPrintings(res,cards,rowFn,l=>l.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>add(b)),await ownedPrintings(cards))}
async function add(b){const[i,f]=b.dataset.a.split(':'),c=window._c[i],key=c.id+'|'+f;window._added=window._added||{};b.disabled=true;
if(window._added[key]){const id=window._added[key].id;
const r0=await sb.from('entries').select('qty').eq('id',id);
if(r0.data&&r0.data.length){if(r0.data[0].qty>1)await sb.from('entries').update({qty:r0.data[0].qty-1}).eq('id',id);else await sb.from('entries').delete().eq('id',id)}
delete window._added[key]}
else{const bd=$('ab')?$('ab').value:'main';
const{data:ex}=await sb.from('entries').select('id,qty').eq('collection_id',cur.id).eq('scryfall_id',c.id).eq('finish',f).eq('board',bd);
let id;
if(ex&&ex.length){await sb.from('entries').update({qty:ex[0].qty+1}).eq('id',ex[0].id);id=ex[0].id}
else{const ins=await sb.from('entries').insert({collection_id:cur.id,scryfall_id:c.id,finish:f,board:bd,...extraOf(c),ownership:$('own')&&!$('own').checked?'need':'owned',name:c.name,type_line:c.type_line||c.card_faces?.[0]?.type_line||null,colors:(c.colors||c.card_faces?.[0]?.colors||[]).join(','),cmc:c.cmc,rarity:c.rarity,set_name:c.set_name,artist:c.artist||c.card_faces?.[0]?.artist||null,set_code:c.set,collector:c.collector_number,
details:[c.full_art&&'full art',c.border_color=='borderless'&&'borderless',c.promo&&'promo'].filter(Boolean).join(', ')}).select('id');id=ins.data&&ins.data[0]&&ins.data[0].id}
window._added[key]={id};
const p=+c.prices[COL[f]];if(p)await sb.from('prices').upsert({scryfall_id:c.id,finish:f,snap_date:new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'}),usd:p},{ignoreDuplicates:true})}
const on=!!window._added[key];b.disabled=false;b.setAttribute('aria-pressed',String(on));b.textContent=on?'✓ Added · tap to remove':f+' '+money(+c.prices[COL[f]]||null)}
const pv=document.getElementById('pv'),big=id=>`https://cards.scryfall.io/normal/front/${id[0]}/${id[1]}/${id}.jpg`;
